name: SkillAtlas
options:
  bundleIdPrefix: com.skillatlas
  deploymentTarget:
    macOS: "14.0"
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
targets:
  SkillAtlas:
    type: application
    platform: macOS
    sources:
      - path: Sources/SkillAtlas
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.skillatlas.app
      INFOPLIST_FILE: Sources/SkillAtlas/Resources/Info.plist
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
